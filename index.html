<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Five Nights at Harley's</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================
     MAIN MENU
========================= -->

<div id="menu">

    <div class="menuNoise"></div>

    <h1>
        FIVE NIGHTS<br>
        AT HARLEY'S
    </h1>

    <h2>NIGHT 1</h2>

    <button id="startButton">
        START NIGHT
    </button>

    <p>
        Survive until 6 AM.
    </p>

</div>


<!-- =========================
     OFFICE
========================= -->

<div id="office" class="hidden">

    <div class="officeWall"></div>

    <!-- LEFT HALL -->

    <div id="leftHall" class="hall leftHall">

        <div id="leftHarley"
             class="hallHarley hidden">
        </div>

    </div>


    <!-- RIGHT HALL -->

    <div id="rightHall" class="hall rightHall">

        <div id="rightHarley"
             class="hallHarley hidden">
        </div>

    </div>


    <!-- OFFICE DECOR -->

    <div class="poster">
        HARLEY'S
        <small>
            HAVE A GREAT NIGHT
        </small>
    </div>


    <div class="desk">

        <div class="computer">
            SECURITY
        </div>

    </div>


    <!-- DOORS -->

    <div id="leftDoor"
         class="door leftDoor">
    </div>

    <div id="rightDoor"
         class="door rightDoor">
    </div>


    <!-- HUD -->

    <div class="hud">

        <div>
            NIGHT 1
        </div>

        <strong id="clock">
            12 AM
        </strong>

        <div id="power">
            POWER 100%
        </div>

    </div>


    <!-- LEFT CONTROLS -->

    <div class="sideControls leftControls">

        <button id="leftLightButton">
            💡 LIGHT
        </button>

        <button id="leftDoorButton">
            🚪 DOOR
        </button>

    </div>


    <!-- RIGHT CONTROLS -->

    <div class="sideControls rightControls">

        <button id="rightLightButton">
            💡 LIGHT
        </button>

        <button id="rightDoorButton">
            🚪 DOOR
        </button>

    </div>


    <!-- CAMERA BUTTON -->

    <button id="cameraButton"
            class="cameraButton">

        📹 CAMERAS

    </button>


    <!-- PHONE CALL -->

    <div id="phoneCall">

        <div class="phoneBox">

            <h2>
                INCOMING CALL
            </h2>

            <p id="callText">
            </p>

            <button id="skipCall">
                SKIP
            </button>

        </div>

    </div>

</div>


<!-- =========================
     CAMERA SYSTEM
========================= -->

<div id="cameras"
     class="hidden">

    <div id="cameraStatic">
    </div>


    <div class="cameraScreen">

        <div id="cameraName">
            CAM 1 — LIVING ROOM
        </div>


        <!-- ROOM VISUAL -->

        <div id="cameraRoom"
             class="room">

            <div class="roomFloor"></div>

            <div class="roomWall"></div>

            <div class="couch">
            </div>

            <div class="table">
            </div>

            <div class="lamp">
            </div>

        </div>


        <!-- HARLEY -->

        <div id="cameraHarley"
             class="cameraHarley hidden">

            <div class="harleyHead"></div>

            <div class="harleyBody"></div>

            <div class="harleyEyes">
                • •
            </div>

        </div>

    </div>


    <!-- CAMERA MAP -->

    <div class="cameraMap">

        <button onclick="changeCamera(1)">
            CAM 1
        </button>

        <button onclick="changeCamera(2)">
            CAM 2
        </button>

        <button onclick="changeCamera(3)">
            CAM 3
        </button>

        <button onclick="changeCamera(4)">
            CAM 4
        </button>

        <button onclick="changeCamera(5)">
            CAM 5
        </button>

    </div>


    <button id="closeCameras">

        LOWER CAMERA

    </button>

</div>


<!-- =========================
     JUMPSCARE
========================= -->

<div id="jumpscare"
     class="hidden">

    <div class="jumpscareFace">

        <div class="eye leftEye"></div>

        <div class="eye rightEye"></div>

        <div class="mouth">
        </div>

    </div>

</div>


<!-- =========================
     GAME OVER
========================= -->

<div id="gameOver"
     class="hidden">

    <h1 id="gameOverTitle">
        GAME OVER
    </h1>

    <p id="gameOverText">
    </p>

    <button onclick="location.reload()">
        TRY AGAIN
    </button>

</div>


<script src="game.js"></script>

</body>

</html>
