<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Five Nights at Harley's</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="menu">
    <div class="menu-content">
      <p>HARLEY'S HOUSE</p>
      <h1>FIVE NIGHTS<br>AT HARLEY'S</h1>

      <h2>NIGHT 1</h2>

      <button id="startButton">START NIGHT</button>

      <small>Survive until 6 AM.</small>
    </div>
  </div>

  <div id="game" class="hidden">

    <div id="office">

      <div class="office-wall">
        <div class="ceiling-light"></div>
        <div class="window"></div>
        <div class="picture"></div>

        <div class="desk">
          <div class="monitor"></div>
          <div class="phone"></div>
          <div class="lamp"></div>
        </div>
      </div>

      <div id="leftHall" class="hall left-hall">
        <div id="leftMonster" class="monster hidden"></div>
      </div>

      <div id="rightHall" class="hall right-hall">
        <div id="rightMonster" class="monster hidden"></div>
      </div>

      <div id="leftDoor" class="door left-door"></div>
      <div id="rightDoor" class="door right-door"></div>

      <div class="hud">
        <div>NIGHT 1</div>
        <strong id="time">12 AM</strong>
        <div id="power">POWER: 100%</div>
      </div>

      <div class="controls left-controls">
        <button id="leftLight">LIGHT</button>
        <button id="leftDoorBtn">DOOR</button>
      </div>

      <div class="controls right-controls">
        <button id="rightLight">LIGHT</button>
        <button id="rightDoorBtn">DOOR</button>
      </div>

      <button id="cameraBtn" class="camera-button">
        CAMERAS
      </button>

    </div>


    <!-- CAMERA SYSTEM -->

    <div id="cameraScreen" class="hidden">

      <div id="cameraTitle">
        CAM 1 — LIVING ROOM
      </div>

      <div id="cameraRoom" class="camera-room cam1">

        <div class="room-ceiling"></div>
        <div class="room-wall"></div>
        <div class="room-floor"></div>

        <div class="window-room"></div>

        <div class="couch"></div>
        <div class="table"></div>
        <div class="tv"></div>

        <div class="counter"></div>
        <div class="fridge"></div>

        <div class="bed"></div>
        <div class="nightstand"></div>

        <div class="family-picture"></div>

        <div id="cameraMonster" class="camera-monster hidden">
          <div class="monster-head"></div>
          <div class="monster-body"></div>
        </div>

      </div>


      <div class="camera-map">

        <button data-camera="1">
          CAM 1<br>
          Living Room
        </button>

        <button data-camera="2">
          CAM 2<br>
          Kitchen
        </button>

        <button data-camera="3">
          CAM 3<br>
          Bedroom
        </button>

        <button data-camera="4">
          CAM 4<br>
          Left Hall
        </button>

        <button data-camera="5">
          CAM 5<br>
          Right Hall
        </button>

      </div>

      <button id="lowerCamera">
        LOWER CAMERA
      </button>

    </div>


    <!-- PHONE CALL -->

    <div id="callOverlay" class="hidden">

      <div class="call-box">

        <div id="ringText">
          ☎ INCOMING CALL...
        </div>

        <h2>UNKNOWN CALLER</h2>

        <p id="callText"></p>

        <button id="skipCall">
          SKIP CALL
        </button>

      </div>

    </div>

  </div>


  <!-- JUMPSCARE -->

  <div id="jumpscare" class="hidden">

    <div class="scare">

      <div class="scare-head">

        <div class="scare-eye"></div>
        <div class="scare-eye"></div>

      </div>

      <div class="scare-body"></div>

      <div class="scare-mouth"></div>

    </div>

  </div>


  <!-- GAME OVER -->

  <div id="gameOver" class="hidden">

    <h1 id="resultTitle">
      GAME OVER
    </h1>

    <p id="resultText"></p>

    <button onclick="location.reload()">
      TRY AGAIN
    </button>

  </div>


  <script src="game.js"></script>

</body>
</html>
